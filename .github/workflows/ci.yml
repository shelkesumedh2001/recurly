name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze (fail on warnings+)
        run: flutter analyze --no-fatal-infos lib/ test/

      # Full suite, smoke test included (it runs against mocked Firebase +
      # fake_cloud_firestore since 2026-07-02).
      - name: Run tests
        run: flutter test
